services:
  # ------------------------------------------------------------------
  # MS SQL Server 2022
  # ------------------------------------------------------------------
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smartqrmenu-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrongPassword123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Ollama (Llama 3 + nomic-embed-text)
  # ------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: smartqrmenu-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # Ollama hazir olana kadar cURL ile bekler, ardindan modelleri otomatik ceker.
  # Modeller ollama_data volume'unde saklandigi icin sonraki acilislarda tekrar indirilmez.
  ollama-model-puller:
    image: curlimages/curl:latest
    container_name: smartqrmenu-ollama-model-puller
    depends_on:
      - ollama
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Ollama servisinin hazir olmasi bekleniyor...";
        until curl -sf http://ollama:11434/api/tags > /dev/null; do
          echo "Ollama henuz hazir degil, 3 saniye sonra tekrar denenecek...";
          sleep 3;
        done;
        echo "Ollama hazir. llama3 modeli indiriliyor (ilk calistirmada birkac dakika surebilir)...";
        curl -s http://ollama:11434/api/pull -d '{"name":"llama3"}';
        echo "";
        echo "nomic-embed-text modeli indiriliyor...";
        curl -s http://ollama:11434/api/pull -d '{"name":"nomic-embed-text"}';
        echo "";
        echo "Tum modeller hazir.";

  # ------------------------------------------------------------------
  # Web uygulamasi (Project.Web)
  # ------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Project.Web/Dockerfile
    container_name: smartqrmenu-web
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=db;Database=SmartQRMenuDb;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;"
      AiSettings__Ollama__Endpoint: "http://ollama:11434"
      AiSettings__FoundryLocal__Endpoint: "http://host.docker.internal:5272/v1/"
      # Program.cs Ollama adresini "Ollama:Endpoint" anahtarindan okudugu icin
      # container ici erisim adresi burada da override edilir.
      Ollama__Endpoint: "http://ollama:11434"
    extra_hosts:
      # Host makinede calisan Foundry Local'a (5272) erisim icin
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  sql_data:
  ollama_data:
